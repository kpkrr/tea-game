# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: recipe_price
    status: active
    source: design/gdd/order-recipe-system.md
    referenced_by:
      - design/gdd/order-recipe-system.md
      - design/gdd/guest-ai-patience.md
      - design/gdd/brewing-crafting-mechanic.md
      - design/gdd/difficulty-curve-session-pacing.md
      - design/gdd/currency-coins-score.md
      - design/gdd/hud-feedback-ui.md
    variables:
      - recipe_id
      - price_table
    output_range: [2, 7]
    expression: "price_table[recipe_id]"
    notes: "Table lookup, not computed from step count. Load-time invariants:
      price_complex <= (price_simple + price_medium) * 1.15 and
      price_complex <= price_medium * 1.6 (checked in integers). Read by
      Currency: Coins & Score (coins and score multiplier) and HUD. Values
      provisional until /balance-check together with till capacity."
    added: 2026-09-28
    revised: ""

  - name: remaining_fraction
    status: active
    source: design/gdd/guest-ai-patience.md
    referenced_by:
      - design/gdd/guest-ai-patience.md
      - design/gdd/order-recipe-system.md
      - design/gdd/difficulty-curve-session-pacing.md
      - design/gdd/currency-coins-score.md
      - design/gdd/hud-feedback-ui.md
    variables:
      - t_since_spawn
      - patience_max_g
    output_range: [0, 1]
    expression: "clamp(1 - t_since_spawn / patience_max_g, 0, 1)"
    notes: "Linear patience decay per guest. patience_max_g is captured once
      at spawn from patience_max(t) (Difficulty Curve; baseline 50 s) and never
      recomputed. Read by Currency: Coins & Score on Served (score multiplier
      1 + remaining_fraction) and by HUD (patience ring)."
    added: 2026-09-28
    revised: ""

  - name: difficulty_progress
    status: active
    source: design/gdd/difficulty-curve-session-pacing.md
    referenced_by:
      - design/gdd/difficulty-curve-session-pacing.md
      - design/gdd/guest-ai-patience.md
    variables:
      - t
      - ramp_duration
      - curve_exponent
    output_range: [0, 1]
    expression: "clamp(t / ramp_duration, 0, 1) ^ curve_exponent"
    notes: "Shared ease-in progress for all three difficulty curves. t is
      match time without pauses, always passed as an argument. 1 at
      t >= ramp_duration (plateau). Soft input for HUD and Audio (not yet
      designed)."
    added: 2026-09-28
    revised: ""

  - name: guests_per_minute
    status: active
    source: design/gdd/difficulty-curve-session-pacing.md
    referenced_by:
      - design/gdd/difficulty-curve-session-pacing.md
      - design/gdd/guest-ai-patience.md
    variables:
      - guests_per_minute_start
      - guests_per_minute_end
      - difficulty_progress
    output_range: [15, 18]
    expression: "start + (end - start) * difficulty_progress(t)"
    notes: "start 15.0 (8.0 -> 7.0 /balance-check 2026-09-29, Difficulty
      Curve OQ #7; 7.0 -> 15.0 owner playtest 2026-10-01, OQ #8), end 18.0 — author decision (difficulty-curve-
      session-pacing.md Core Rule 1), not sourced from game-concept. Read by
      Guest AI Formula 1 before its onboarding_multiplier."
    added: 2026-09-28
    revised: "2026-10-01"

  - name: patience_max
    status: active
    source: design/gdd/difficulty-curve-session-pacing.md
    referenced_by:
      - design/gdd/difficulty-curve-session-pacing.md
      - design/gdd/guest-ai-patience.md
    variables:
      - patience_max_start
      - patience_max_end
      - difficulty_progress
    output_range: [25, 50]
    expression: "start + (end - start) * difficulty_progress(t)"
    notes: "start 50.0 s, end 25.0 s — author decision (difficulty-curve-
      session-pacing.md Core Rule 1), not sourced from game-concept. Read
      once per guest at spawn as patience_max_g (Guest AI Formula 2),
      never recomputed."
    added: 2026-09-28
    revised: ""

  - name: complex_order_share
    status: active
    source: design/gdd/difficulty-curve-session-pacing.md
    referenced_by:
      - design/gdd/difficulty-curve-session-pacing.md
      - design/gdd/guest-ai-patience.md
    variables:
      - complex_share_start
      - complex_share_end
      - difficulty_progress
    output_range: [0, 0.4]
    expression: "start + (end - start) * difficulty_progress(t)"
    notes: "start 0.0, end 0.40 — author decision (difficulty-curve-session-
      pacing.md Core Rule 1), not sourced from game-concept. Read by Guest
      AI Formula 3; ignored during onboarding (simple only)."
    added: 2026-09-28
    revised: ""

  - name: score_earned
    status: active
    source: design/gdd/currency-coins-score.md
    referenced_by:
      - design/gdd/currency-coins-score.md
    variables:
      - recipe_id
      - recipe_price
      - remaining_fraction
      - score_multiplier_base
    output_range: [20, 140]
    expression: "round(recipe_price(recipe_id) * score_multiplier_base * (1 + remaining_fraction))"
    notes: "Theoretical range [20,140]; practical ceiling ~115-130
      (remaining_fraction=1.0 unreachable — guest travel time to slot
      before Served is possible). Rounded round() half-up at compute
      time, never stored as float — match_score/best_score always int.
      Reads recipe_price (order-recipe-system.md) and remaining_fraction
      (guest-ai-patience.md). Never conditioned on till capacity or any
      Progression/Monetization variable (Core Rule 9) — validated by
      economy-designer 2026-09-28. Known crossover: a perfectly-served
      medium recipe (5x10x2=100) can outscore a complex recipe served at
      the edge (7x10x1=70) when remaining_fraction > 0.4 — intended, not
      a bug (see Edge Cases)."
    added: 2026-09-28
    revised: ""

  - name: is_new_record
    status: active
    source: design/gdd/currency-coins-score.md
    referenced_by:
      - design/gdd/currency-coins-score.md
      - design/gdd/hud-feedback-ui.md
    variables:
      - match_score
      - best_score
    output_range: [false, true]
    expression: "match_score > best_score  # evaluated on match_ended BEFORE best_score is updated"
    notes: "Bool, computed by Currency at the match_ended Frozen transition
      using best_score's pre-update value (absent best_score = 0). Held
      until match_started resets it to false. HUD reads it for the
      new-record accent (HUD Core Rule 13) instead of comparing itself —
      by render time best_score is already updated. Added 2026-09-29
      batch-fix (cross-review S4)."
    added: 2026-09-29
    revised: ""

  - name: record_passed
    status: active
    source: design/gdd/currency-coins-score.md
    referenced_by:
      - design/gdd/currency-coins-score.md
      - design/gdd/hud-feedback-ui.md
    variables:
      - match_score
      - best_at_start
    output_range: [false, true]
    expression: "best_at_start > 0 and match_score > best_at_start  # first Served that satisfies it; fires once per match"
    notes: "Event, not a stored value. best_at_start = best_score at
      match_started. Drives mid-match NEW BEST! popup (game-flow.md M11).
      Never fires in the first-ever match (best 0) or on a tie. Currency
      Rule 10, added 2026-10-01."
    added: 2026-10-01
    revised: ""

  - name: day_index
    status: active
    source: design/gdd/till-day-cycle.md
    referenced_by:
      - design/gdd/till-day-cycle.md
      - design/gdd/player-stats.md
    variables:
      - now_utc_s
      - daily_reset_time_utc
    output_range: [0, unbounded]
    expression: "floor((now_utc_s - daily_reset_time_utc * 3600) / 86400)"
    notes: "Game-day number; boundaries coincide with till reset moments.
      Carried by day_filled(day_index) (Till Rule 10) and used by Player
      Stats streak / displayed_streak. Till Formula 5, added 2026-10-01."
    added: 2026-10-01
    revised: ""

  - name: coins_earned
    status: active
    source: design/gdd/currency-coins-score.md
    referenced_by:
      - design/gdd/currency-coins-score.md
      - design/gdd/till-day-cycle.md
    variables:
      - recipe_id
      - recipe_price
    output_range: [2, 7]
    expression: "recipe_price(recipe_id)"
    notes: "Direct passthrough of recipe_price, no modifiers. Emitted to
      Till & Day Cycle on every Served event regardless of till capacity
      — till decides whether to accept it, this formula never checks."
    added: 2026-09-28
    revised: ""

  - name: till_amount
    status: active
    source: design/gdd/till-day-cycle.md
    referenced_by:
      - design/gdd/till-day-cycle.md
      - design/gdd/hud-feedback-ui.md
    variables:
      - till_amount
      - coins_earned
      - till_capacity
    output_range: [0, 250]
    expression: "min(till_amount + coins_earned, till_capacity)"
    notes: "Partial-add-to-ceiling on every Served event; never exceeds
      till_capacity. Does not affect score_earned/match_score/best_score
      (owned exclusively by currency-coins-score.md). Persists across
      matches via local save; resets to 0 only on Full → Open transition
      (daily_reset_time_utc). Reaching till_capacity no longer blocks new
      matches (revised /balance-check 2026-09-29, till-day-cycle.md Core
      Rule 4/5) — only coin growth stops, matches remain unrestricted."
    added: 2026-09-29
    revised: "2026-09-29"

  - name: audio_stem_target_db
    status: active
    source: design/gdd/audio-juice-feedback.md
    referenced_by:
      - design/gdd/audio-juice-feedback.md
      - design/gdd/difficulty-curve-session-pacing.md
    variables:
      - difficulty_progress
      - stem_threshold
      - last_strike
      - stem_on_db
      - stem_off_db
    output_range: [-80, 0]
    expression: "(dp >= stem_threshold[i] and not (i == 4 and last_strike)) ? stem_on_db : stem_off_db"
    notes: "F1. Thresholds 0 / 0.03 / 0.25 / 1.0; dp from difficulty-curve-session-pacing.md F1."
    added: 2026-10-01
    revised: ""

  - name: audio_layer_fade_start
    status: active
    source: design/gdd/audio-juice-feedback.md
    referenced_by:
      - design/gdd/audio-juice-feedback.md
    variables:
      - music_pos
      - bpm
      - bar_len
      - stem_fade_bars
    output_range: [0, 96]
    expression: "bar_len * ceil(music_pos / bar_len), bar_len = 240 / bpm"
    notes: "F2. Fade lasts stem_fade_bars (2) bars = 4 s; S4 on last strike quantised to a beat (0.5 s)."
    added: 2026-10-01
    revised: ""

  - name: audio_star_pitch_scale
    status: active
    source: design/gdd/audio-juice-feedback.md
    referenced_by:
      - design/gdd/audio-juice-feedback.md
      - design/gdd/currency-coins-score.md
    variables:
      - t_served
      - t_prev_served
      - combo_window_s
      - streak
      - star_ladder_st
    output_range: [1.0, 2.0]
    expression: "2^(star_ladder_st[min(streak, 5)] / 12); streak += 1 if gap <= combo_window_s else 0"
    notes: "F3. Ladder 0/2/5/7/9/12 semitones from C5 (F pentatonic); Leaving resets streak. Coins never use it (Pillar 4)."
    added: 2026-10-01
    revised: ""

  - name: audio_voice_allowed
    status: active
    source: design/gdd/audio-juice-feedback.md
    referenced_by:
      - design/gdd/audio-juice-feedback.md
      - design/gdd/guest-ai-patience.md
    variables:
      - n_active
      - voice_max
      - prio
      - voice_min_gap_s
      - voice_guest_cooldown_s
      - p_event
      - n_waiting
    output_range: [false, true]
    expression: "(n_active < voice_max or prio(e) > prio_min_active) and gap_ok and cooldown_ok and rng() < p(e); p(order) = clamp(1 - 0.25*(n_waiting-1), 0.25, 1)"
    notes: "F4. leaving bypasses gap/cooldown; RNG injected (seeded in tests)."
    added: 2026-10-01
    revised: ""

  - name: audio_music_duck_db
    status: active
    source: design/gdd/audio-juice-feedback.md
    referenced_by:
      - design/gdd/audio-juice-feedback.md
    variables:
      - tau
      - L
      - duck_depth_db
      - duck_attack_s
      - duck_release_s
    output_range: [-6, 0]
    expression: "tau <= L ? depth * min(tau/attack, 1) : depth * max(1 - (tau-L)/release, 0)"
    notes: "F5. Script ramp on Music bus volume (Sample SFX bypass mixer, no sidechain); two stingers -> min."
    added: 2026-10-01
    revised: ""

  - name: audio_sfx_victim
    status: active
    source: design/gdd/audio-juice-feedback.md
    referenced_by:
      - design/gdd/audio-juice-feedback.md
    variables:
      - class_rank
      - start_time
      - sfx_voice_max
      - cap_class
    output_range: [none, one voice]
    expression: "argmin over active voices of class P2..P4 by (class_rank, start_time); evict if class_rank(new) >= class_rank(victim)"
    notes: "F6. P0/P1 never evicted; eviction fade 20 ms."
    added: 2026-10-01
    revised: ""

