  prompt: 'Use the reference image ONLY for art style, materials, lighting, camera feel and character rendering; create a
    completely new tall portrait composition. Top-down gameplay screenshot of a mobile arcade game: a barista rushing between
    stations in a cozy tea house kitchen, two clay kettles steaming on small hearth fires, jars of black and green tea leaves,
    a bowl of lemons, a stack of white cups, a big golden wooden cash box (till) on the counter, three guests waiting in a
    queue at the counter edge | cozy rustic tea house kitchen on a floating stone terrace diorama above a river, cliffs and
    water visible around the edges, stone tile floor, thick honey-wood counters, low stone-and-log parapet with rope railings,
    lanterns on posts, crates and closed sacks of tea leaves, clay teapots, potted plants, steam puffs | chunky stylized 3D
    with hand-painted textures, soft rounded bevels, cozy clutter only at the edges, clear open walkways | warm golden late-afternoon
    light, lantern glow, small fires under kettles, amber shadows, soft cool shadows only on the distant water | fixed high-angle
    perspective camera looking down about 52 degrees, narrow field of view, miniature diorama feel, portrait 9:19.5 framing
    | 2D cartoon chibi characters with bold dark-umber outline, head about half of body height, huge expressive faces, dynamic
    poses | palette anchors: #2B1D1A #F6EAD3 #F2B632, warm desaturated stone and wood | no text, no logos, no chef hats, no
    tomatoes, no red or bright green produce, no red banners, no gold coins, no neon, no photorealism, no pixel art'
