# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: visibility_change
    status: active
    pattern: signal
    producer: platform-bridge
    consumers:
      - match-lifecycle   # pauses/resumes GameClock
    adr: docs/architecture/adr-0001-web-build-platform-shell.md
    signal_signature: "visibility_changed(visible: bool)"
    referenced_by:
      - docs/architecture/adr-0001-web-build-platform-shell.md
      - docs/architecture/adr-0003-match-simulation-clock-tick-events.md
    added: 2026-09-30
    revised: ""

  - contract: safe_area_update
    status: active
    pattern: signal
    producer: platform-bridge
    consumers:
      - view-fit          # sole consumer; HUD lays out from view-fit's playfield_update (ADR-0002)
    # revised 2026-09-30 by ADR-0002 — old consumers: [view-fit, hud]
    adr: docs/architecture/adr-0001-web-build-platform-shell.md
    signal_signature: "safe_area_changed(rect: Rect2)"
    referenced_by:
      - docs/architecture/adr-0001-web-build-platform-shell.md
      - docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    added: 2026-09-30
    revised: 2026-09-30

  - contract: playfield_update
    status: active
    pattern: signal
    producer: view-fit
    consumers:
      - hud               # lays out screen strips outside kitchen_rect
    adr: docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    signal_signature: "playfield_changed(playfield: Rect2, kitchen_rect: Rect2)"
    referenced_by:
      - docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    added: 2026-09-30
    revised: ""

  - contract: match_lifecycle_events
    status: active
    pattern: signal
    producer: match-lifecycle
    consumers:
      - brewing
      - currency
      - till              # match_started only
      - barista-controller
      - guest-sim
      - hud
    adr: docs/architecture/adr-0003-match-simulation-clock-tick-events.md
    signal_signature: "match_started(); match_ended()"
    notes: "Synchronous, connected only in MatchDirector._compose(); match_started emitted at tick step 0"
    referenced_by:
      - docs/architecture/adr-0003-match-simulation-clock-tick-events.md
    added: 2026-09-30
    revised: ""

  - contract: new_match_request
    status: active
    pattern: direct_call
    producer: hud
    consumers:
      - match-lifecycle
    adr: docs/architecture/adr-0003-match-simulation-clock-tick-events.md
    signal_signature: "MatchLifecycle.request_new_match() -> void (command method, queued + deduped, applied at tick step 0; not a signal)"
    referenced_by:
      - docs/architecture/adr-0003-match-simulation-clock-tick-events.md
    added: 2026-09-30
    revised: ""

  - contract: served_chain
    status: active
    pattern: signal
    producer: guest-sim
    consumers:
      - currency          # -> coins_earned(amount: int) -> till -> coins_added(amount: int) -> hud; score_earned(amount: int) -> hud
    adr: docs/architecture/adr-0003-match-simulation-clock-tick-events.md
    signal_signature: "served(recipe_id: StringName, remaining_fraction: float)"
    notes: "Whole chain completes synchronously inside GuestSim.step sub-step (a); no CONNECT_DEFERRED"
    referenced_by:
      - docs/architecture/adr-0003-match-simulation-clock-tick-events.md
    added: 2026-09-30
    revised: ""

  - contract: game_time_running
    status: active
    pattern: signal
    producer: game-clock
    consumers:
      - presentation      # GameTimeSprite pause()/play(); also checks is_running() in _ready
    adr: docs/architecture/adr-0003-match-simulation-clock-tick-events.md
    signal_signature: "running_changed(running: bool)"
    referenced_by:
      - docs/architecture/adr-0003-match-simulation-clock-tick-events.md
    added: 2026-09-30
    revised: ""

  - contract: config_injection
    status: active
    pattern: direct_call
    producer: config-loader
    consumers:
      - all-match-modules  # receive their own sub-resource (and read-only foreign ones) via constructor
    adr: docs/architecture/adr-0004-data-config-load-validation.md
    signal_signature: "Module.new(cfg.<system>: <System>Config, …); ConfigValidator.validate(cfg: GameConfig) -> Array[ConfigError]"
    referenced_by:
      - docs/architecture/adr-0004-data-config-load-validation.md
    added: 2026-09-30
    revised: ""

  - contract: boot_failure
    status: active
    pattern: direct_call
    producer: match-director
    consumers:
      - platform-bridge
    adr: docs/architecture/adr-0004-data-config-load-validation.md
    signal_signature: "PlatformBridge.fail_boot(message: String) -> void  # Loading -> Failed; ready_reached never emitted"
    referenced_by:
      - docs/architecture/adr-0004-data-config-load-validation.md
      - docs/architecture/adr-0001-web-build-platform-shell.md
    added: 2026-09-30
    revised: ""

  - contract: rng_injection
    status: active
    pattern: direct_call
    producer: match-director
    consumers:
      - guest-sim          # streams guest_tier, guest_recipe
      - presentation       # stream cosmetic
    adr: docs/architecture/adr-0004-data-config-load-validation.md
    signal_signature: "Rng (RefCounted): randf() -> float [0,1); randi_range(from, to) -> int. Streams seeded splitmix64(match_seed ^ STREAM_CONST)"
    referenced_by:
      - docs/architecture/adr-0004-data-config-load-validation.md
    added: 2026-09-30
    revised: ""

  - contract: save_scope_access
    status: active
    pattern: direct_call
    producer: save-store
    consumers:
      - currency
      - till
    adr: docs/architecture/adr-0005-local-persistence-savestore.md
    signal_signature: "SaveScope.declare_int(key, default, min, max); read_int(key) -> int; write_int(key, value) (memory only, marks dirty)"
    referenced_by:
      - docs/architecture/adr-0005-local-persistence-savestore.md
    added: 2026-09-30
    revised: ""

  - contract: web_save_helper
    status: active
    pattern: direct_call
    producer: html-shell
    consumers:
      - save-store       # WebStorageBackend via JavaScriptBridge.get_interface("teaRushSave")
    adr: docs/architecture/adr-0005-local-persistence-savestore.md
    signal_signature: "window.teaRushSave = {available: bool, read() -> string|null, write(s) -> bool} over localStorage key tea_rush.save"
    referenced_by:
      - docs/architecture/adr-0005-local-persistence-savestore.md
      - docs/architecture/adr-0001-web-build-platform-shell.md
    added: 2026-09-30
    revised: ""

