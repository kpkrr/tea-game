# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: web_visibility_detection
    status: active
    api: "JavaScriptBridge.create_callback bound to document.visibilitychange"
    not: "NOTIFICATION_APPLICATION_FOCUS_IN/OUT, NOTIFICATION_APPLICATION_PAUSED/RESUMED (broken on web, godotengine/godot#87014)"
    adr: docs/architecture/adr-0001-web-build-platform-shell.md
    reason: "Built-in lifecycle notifications do not fire on web export; browser also halts _process while hidden, so polling cannot work"
    referenced_by:
      - docs/architecture/adr-0001-web-build-platform-shell.md
    added: 2026-09-30
    revised: ""

  - purpose: web_export_threading
    status: active
    api: "Web export preset Thread Support: OFF (single-thread)"
    not: "Threaded export requiring COOP/COEP headers or PWA service-worker header injection"
    adr: docs/architecture/adr-0001-web-build-platform-shell.md
    reason: "Host-agnostic, no cross-origin isolation dependency; avoids unverified iOS SharedArrayBuffer risk; Architecture Principle 5"
    referenced_by:
      - docs/architecture/adr-0001-web-build-platform-shell.md
    added: 2026-09-30
    revised: ""

  - purpose: stretch_and_dp_unit
    status: active
    api: "window/stretch/mode=canvas_items, aspect=expand, base viewport 360x640; 1 viewport unit = 1 reference dp"
    not: "Implicit 4.7 stretch defaults; 540x960 base with a dp_scale factor"
    adr: docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    reason: "Taps, Control layout and unproject_position share one unit; no conversion anywhere"
    referenced_by:
      - docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    added: 2026-09-30
    revised: ""

  - purpose: world_overlays
    status: active
    api: "Sprite3D/Label3D children of entities, fixed camera-facing rotation, no_depth_test + render_priority bands"
    not: "Control nodes positioned via Camera3D.unproject_position each frame"
    adr: docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    reason: "Follow entities, scale with kitchen, pause with game time; GDDs specify world-space billboards"
    referenced_by:
      - docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    added: 2026-09-30
    revised: ""

  - purpose: sprite_camera_facing
    status: active
    api: "Fixed rotation.x = -camera_pitch_deg set once"
    not: "BILLBOARD_ENABLED / billboard modes"
    adr: docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    reason: "Camera never rotates; identical result with zero per-frame cost"
    referenced_by:
      - docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    added: 2026-09-30
    revised: ""

  - purpose: lighting_and_shadows
    status: active
    api: "Unshaded materials, no real-time lights; painted blob-shadow quads under characters, station shadows painted into textures"
    not: "DirectionalLight3D/OmniLight3D with shadow maps"
    adr: docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    reason: "Architecture Principle 5 (WebGL2, weak Android); Kitchen GDD baked lighting"
    referenced_by:
      - docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    added: 2026-09-30
    revised: ""

