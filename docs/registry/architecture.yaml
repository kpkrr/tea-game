# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: visibility_change
    status: active
    pattern: signal
    producer: platform-bridge
    consumers:
      - match-lifecycle   # pauses/resumes GameClock
    adr: docs/architecture/adr-0001-web-build-platform-shell.md
    signal_signature: "visibility_changed(visible: bool)"
    referenced_by:
      - docs/architecture/adr-0001-web-build-platform-shell.md
      - docs/architecture/adr-0003-match-simulation-clock-tick-events.md
    added: 2026-09-30
    revised: ""

  - contract: safe_area_update
    status: active
    pattern: signal
    producer: platform-bridge
    consumers:
      - view-fit          # sole consumer; HUD lays out from view-fit's playfield_update (ADR-0002)
    # revised 2026-09-30 by ADR-0002 — old consumers: [view-fit, hud]
    adr: docs/architecture/adr-0001-web-build-platform-shell.md
    signal_signature: "safe_area_changed(rect: Rect2)"
    referenced_by:
      - docs/architecture/adr-0001-web-build-platform-shell.md
      - docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    added: 2026-09-30
    revised: 2026-09-30

  - contract: playfield_update
    status: active
    pattern: signal
    producer: view-fit
    consumers:
      - hud               # lays out screen strips outside kitchen_rect
    adr: docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    signal_signature: "playfield_changed(playfield: Rect2, kitchen_rect: Rect2)"
    referenced_by:
      - docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    added: 2026-09-30
    revised: ""

  - contract: match_lifecycle_events
    status: active
    pattern: signal
    producer: match-lifecycle
    consumers:
