# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: superseded_by: ADR-NNNN instead.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="status: superseded"

version: 1
last_updated: "2026-09-30"

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: safe_area_rect
    status: active
    owner_system: platform-bridge
    adr: docs/architecture/adr-0001-web-build-platform-shell.md
    interface: "PlatformBridge.safe_area_changed(rect: Rect2) signal + get_safe_area() -> Rect2; window px; emitted at most once per _process tick"
    write_access: platform-bridge-only
    referenced_by:
      - docs/architecture/adr-0001-web-build-platform-shell.md
    added: 2026-09-30
    revised: ""

  - state: platform_ready_state
    status: active
    owner_system: platform-bridge
    adr: docs/architecture/adr-0001-web-build-platform-shell.md
    interface: "PlatformBridge.ready_reached() signal, emitted once (Loading -> Ready) after ConfigLoader + KitchenLayout are ready"
    write_access: platform-bridge-only
    referenced_by:
      - docs/architecture/adr-0001-web-build-platform-shell.md
      - docs/architecture/adr-0003-match-simulation-clock-tick-events.md
    added: 2026-09-30
    revised: ""

  - state: playfield_and_kitchen_rect
    status: active
    owner_system: view-fit
    adr: docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    interface: "ViewFit.playfield_changed(playfield: Rect2, kitchen_rect: Rect2) signal + get_playfield()/get_kitchen_rect(); dp (1 viewport unit = 1 reference dp)"
    write_access: view-fit-only
    referenced_by:
      - docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    added: 2026-09-30
    revised: ""

  - state: game_time
    status: active
    owner_system: game-clock
    adr: docs/architecture/adr-0003-match-simulation-clock-tick-events.md
    interface: "GameClock (RefCounted, injected): t, sim_dt, ui_dt getters; running_changed(running: bool) signal; is_running(). Flags hidden/frozen written only via pause/resume/freeze/reset from MatchLifecycle; advance() called only by MatchDirector"
    write_access: match-lifecycle (commands) + match-director (advance) only
    referenced_by:
      - docs/architecture/adr-0003-match-simulation-clock-tick-events.md
    added: 2026-09-30
    revised: ""

  - state: match_lifecycle_state
    status: active
    owner_system: match-lifecycle
    adr: docs/architecture/adr-0003-match-simulation-clock-tick-events.md
    interface: "MatchLifecycle.state (BOOTING/RUNNING/ENDED, getter); match_started()/match_ended() signals, each exactly once per match"
    write_access: match-lifecycle-only
    referenced_by:
      - docs/architecture/adr-0003-match-simulation-clock-tick-events.md
    added: 2026-09-30
    revised: ""

  - state: game_config
    status: active
    owner_system: config-loader
    adr: docs/architecture/adr-0004-data-config-load-validation.md
    interface: "GameConfig Resource tree (one typed sub-resource per system), loaded + validated once at boot, injected via constructors from MatchDirector._compose(); immutable by convention"
    write_access: none-after-load
    referenced_by:
      - docs/architecture/adr-0004-data-config-load-validation.md
    added: 2026-09-30
    revised: ""

  - state: persistent_save_blob
    status: active
    owner_system: save-store
    adr: docs/architecture/adr-0005-local-persistence-savestore.md
    interface: "SaveStore.scope(owner) -> SaveScope (read_int/write_int/read_string/write_string on own prefix only); flush_if_dirty() by MatchDirector step 6 and page hide only. Keys: currency.best_score (currency), till.amount / till.day_state / till.full_since_utc (till)"
    write_access: each key by its prefix owner only; storage I/O by save-store only
    referenced_by:
      - docs/architecture/adr-0005-local-persistence-savestore.md
    added: 2026-09-30
    revised: ""

