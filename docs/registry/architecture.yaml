# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: sharedarraybuffer_dependency
    status: active
    description: "No code path may require threads, SharedArrayBuffer or cross-origin isolation (COOP/COEP) on web."
    why: "Web export is single-thread and host-agnostic by ADR-0001; changing that requires a superseding ADR backed by on-device measurement."
    adr: docs/architecture/adr-0001-web-build-platform-shell.md
    added: 2026-09-30

  - pattern: canvas_line_primitives_for_rings
    status: active
    description: "Rings, arcs and outlines must not be drawn with CanvasItem line primitives (draw_arc, draw_line, draw_polyline)."
    why: "Godot 4.7 removed line antialiasing feather; lines render visibly thinner. Use textures/sprite frames."
    adr: docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    added: 2026-09-30

  - pattern: screen_scale_conversion_in_gameplay
    status: active
    description: "Gameplay, TapPicker and HUD code must not multiply by devicePixelRatio, window size or screen scale."
    why: "One viewport unit is one dp by ADR-0002; ad-hoc scale factors reintroduce the unit bugs the base canvas choice removed."
    adr: docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    added: 2026-09-30

  - pattern: viewport_size_listening_outside_platform_bridge
    status: active
    description: "No module other than PlatformBridge may connect to get_viewport().size_changed or read DisplayServer window size; ViewFit reacts only to safe_area_changed."
    why: "Single debounced source of viewport changes (ADR-0001); parallel listeners recompute out of order and bypass the once-per-frame debounce."
    adr: docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    added: 2026-09-30

  - pattern: scene_tree_pause_for_gameplay
    status: active
    description: "Gameplay must never set or read get_tree().paused; pause is GameClock hidden/frozen only."
    why: "One pause source; tree pause cannot clamp post-stall delta nor distinguish page-hidden from match-frozen."
    adr: docs/architecture/adr-0003-match-simulation-clock-tick-events.md
    added: 2026-09-30

  - pattern: per_system_simulation_process
    status: active
    description: "Simulation modules must not implement _process/_physics_process or read frame delta, Time, OS or Engine time; only MatchDirector calls step(dt)."
    why: "Tick order (Player Control before Guest AI; serves before timeouts) lives in one function."
    adr: docs/architecture/adr-0003-match-simulation-clock-tick-events.md
    added: 2026-09-30

  - pattern: global_event_bus_autoload
    status: active
    description: "No EventBus autoload; typed signals on owning modules, connected only in MatchDirector._compose(). Modules never reference autoloads by name."
    why: "Hidden coupling, global state in tests, implicit ordering/re-entrancy."
    adr: docs/architecture/adr-0003-match-simulation-clock-tick-events.md
    added: 2026-09-30

  - pattern: deferred_gameplay_signals
    status: active
    description: "Cross-module gameplay signals must not use CONNECT_DEFERRED or call_deferred."
    why: "Served chain and lifecycle resets must complete inside the emitting tick step."
    adr: docs/architecture/adr-0003-match-simulation-clock-tick-events.md
    added: 2026-09-30

  - pattern: engine_timers_for_game_time
    status: active
    description: "Tween, Timer and AnimationPlayer autoplay must not drive effects bound to game time; use GameClock.sim_dt / running_changed."
    why: "They run on frame time and would not stop on hide/freeze."
    adr: docs/architecture/adr-0003-match-simulation-clock-tick-events.md
    added: 2026-09-30

  - pattern: refcounted_lambda_or_bind_connections
    status: active
    description: "Signals between RefCounted modules connect plain method Callables only — no lambdas, no .bind() holding RefCounted."
    why: "Strong references form cycles that RefCounted never frees (leaks across matches and tests)."
    adr: docs/architecture/adr-0003-match-simulation-clock-tick-events.md
    added: 2026-09-30

  - pattern: global_random_in_gameplay
    status: active
    description: "Gameplay code must not call global randf()/randi()/randi_range()/randomize() or create its own RandomNumberGenerator; use the injected Rng stream. Enforced by CI grep over src/."
    why: "Reproducible matches from a logged seed; deterministic tests via FakeRng."
    adr: docs/architecture/adr-0004-data-config-load-validation.md
    added: 2026-09-30

  - pattern: tuning_literals_or_self_loaded_config
    status: active
    description: "No tuning value from a GDD Tuning Knobs table or entities.yaml as a code literal; modules never load()/preload() config themselves nor write to config objects."
    why: "Data-driven values (coding standards, Principle 4); single validated source injected at composition."
    adr: docs/architecture/adr-0004-data-config-load-validation.md
    added: 2026-09-30

  - pattern: changing_config_sentinel_default
    status: active
    description: "A config field's sentinel default must never be changed to a real value."
    why: "The editor omits default-valued fields on save; every .tres that omitted the field would silently adopt the new value and bypass the missing-key check."
    adr: docs/architecture/adr-0004-data-config-load-validation.md
    added: 2026-09-30

  - pattern: owner_side_save_io
    status: active
    description: "Systems must not touch FileAccess, localStorage, JavaScriptBridge or SaveBackend for persistence, nor call flush_if_dirty(); they only write through their SaveScope."
    why: "Single coalesced flush per frame + page-hide flush; ownership enforced by scopes (Pillar 4)."
    adr: docs/architecture/adr-0005-local-persistence-savestore.md
    added: 2026-09-30

  - pattern: persisting_match_state
    status: active
    description: "match_score and any in-match state must never be written to SaveStore."
    why: "Currency GDD: a match interrupted by a crash is lost by design; only best_score and till state persist."
    adr: docs/architecture/adr-0005-local-persistence-savestore.md
    added: 2026-09-30

  - pattern: blocking_boot_on_save_failure
    status: active
    description: "A corrupt, missing or unavailable save must never block boot or a match; fall back to per-key defaults (persistent=false when storage is unavailable or the save is from a newer schema)."
    why: "Save is player data, unlike config (ADR-0004); the game must stay playable in private mode."
    adr: docs/architecture/adr-0005-local-persistence-savestore.md
    added: 2026-09-30

