# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: sharedarraybuffer_dependency
    status: active
    description: "No code path may require threads, SharedArrayBuffer or cross-origin isolation (COOP/COEP) on web."
    why: "Web export is single-thread and host-agnostic by ADR-0001; changing that requires a superseding ADR backed by on-device measurement."
    adr: docs/architecture/adr-0001-web-build-platform-shell.md
    added: 2026-09-30

  - pattern: canvas_line_primitives_for_rings
    status: active
    description: "Rings, arcs and outlines must not be drawn with CanvasItem line primitives (draw_arc, draw_line, draw_polyline)."
    why: "Godot 4.7 removed line antialiasing feather; lines render visibly thinner. Use textures/sprite frames."
    adr: docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    added: 2026-09-30

  - pattern: screen_scale_conversion_in_gameplay
    status: active
    description: "Gameplay, TapPicker and HUD code must not multiply by devicePixelRatio, window size or screen scale."
    why: "One viewport unit is one dp by ADR-0002; ad-hoc scale factors reintroduce the unit bugs the base canvas choice removed."
    adr: docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    added: 2026-09-30

  - pattern: viewport_size_listening_outside_platform_bridge
    status: active
    description: "No module other than PlatformBridge may connect to get_viewport().size_changed or read DisplayServer window size; ViewFit reacts only to safe_area_changed."
    why: "Single debounced source of viewport changes (ADR-0001); parallel listeners recompute out of order and bypass the once-per-frame debounce."
    adr: docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    added: 2026-09-30

