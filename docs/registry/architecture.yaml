# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: web_visibility_detection
    status: active
    api: "JavaScriptBridge.create_callback bound to document.visibilitychange"
    not: "NOTIFICATION_APPLICATION_FOCUS_IN/OUT, NOTIFICATION_APPLICATION_PAUSED/RESUMED (broken on web, godotengine/godot#87014)"
    adr: docs/architecture/adr-0001-web-build-platform-shell.md
    reason: "Built-in lifecycle notifications do not fire on web export; browser also halts _process while hidden, so polling cannot work"
    referenced_by:
      - docs/architecture/adr-0001-web-build-platform-shell.md
    added: 2026-09-30
    revised: ""

  - purpose: web_export_threading
    status: active
    api: "Web export preset Thread Support: OFF (single-thread)"
    not: "Threaded export requiring COOP/COEP headers or PWA service-worker header injection"
    adr: docs/architecture/adr-0001-web-build-platform-shell.md
    reason: "Host-agnostic, no cross-origin isolation dependency; avoids unverified iOS SharedArrayBuffer risk; Architecture Principle 5"
    referenced_by:
      - docs/architecture/adr-0001-web-build-platform-shell.md
    added: 2026-09-30
    revised: ""

  - purpose: stretch_and_dp_unit
    status: active
    api: "window/stretch/mode=canvas_items, aspect=expand, base viewport 360x640; 1 viewport unit = 1 reference dp"
    not: "Implicit 4.7 stretch defaults; 540x960 base with a dp_scale factor"
    adr: docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    reason: "Taps, Control layout and unproject_position share one unit; no conversion anywhere"
    referenced_by:
      - docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    added: 2026-09-30
    revised: ""

  - purpose: world_overlays
    status: active
    api: "Sprite3D/Label3D children of entities, fixed camera-facing rotation, no_depth_test + render_priority bands"
    not: "Control nodes positioned via Camera3D.unproject_position each frame"
    adr: docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    reason: "Follow entities, scale with kitchen, pause with game time; GDDs specify world-space billboards"
    referenced_by:
      - docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    added: 2026-09-30
    revised: ""

  - purpose: sprite_camera_facing
    status: active
    api: "Fixed rotation.x = -camera_pitch_deg set once"
    not: "BILLBOARD_ENABLED / billboard modes"
    adr: docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    reason: "Camera never rotates; identical result with zero per-frame cost"
    referenced_by:
      - docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    added: 2026-09-30
    revised: ""

  - purpose: lighting_and_shadows
    status: active
    api: "Unshaded materials, no real-time lights; painted blob-shadow quads under characters, station shadows painted into textures"
    not: "DirectionalLight3D/OmniLight3D with shadow maps"
    adr: docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    reason: "Architecture Principle 5 (WebGL2, weak Android); Kitchen GDD baked lighting"
    referenced_by:
      - docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    added: 2026-09-30
    revised: ""

  - purpose: simulation_tick_driver
    status: active
    api: "Single MatchDirector Node._process, process_priority = -100, variable delta clamped by GameClock (max_step_delta 0.25 s); modules are RefCounted with step(dt)"
    not: "_physics_process fixed step; per-system _process; SceneTree.paused"
    adr: docs/architecture/adr-0003-match-simulation-clock-tick-events.md
    reason: "No physics; fixed step judders on 90/120 Hz and replays catch-up steps after stalls on web; one owner of tick order"
    referenced_by:
      - docs/architecture/adr-0003-match-simulation-clock-tick-events.md
    added: 2026-09-30
    revised: ""

  - purpose: tuning_data_format
    status: active
    api: "Typed custom Resource classes saved as .tres in assets/data/config/ (GameConfig root + one sub-resource per system, uid:// ExtResources); sentinel defaults (NAN / -1 / &\"\" / []) mark missing keys; no bool knobs"
    not: "JSON + manual mapping; const tuning scripts; Curve resources for difficulty"
    adr: docs/architecture/adr-0004-data-config-load-validation.md
    reason: "Typed, inspector-editable, pure in-memory validation in tests; .tres coerces wrong types silently (verified 4.7.2), so a shipped-values CI test is mandatory"
    referenced_by:
      - docs/architecture/adr-0004-data-config-load-validation.md
    added: 2026-09-30
    revised: ""

  - purpose: config_validation_policy
    status: active
    api: "ConfigValidator.validate collects all errors with dotted path; identical in debug and release; failure -> PlatformBridge.fail_boot"
    not: "assert()-only invariants stripped from release; stop-at-first-error"
    adr: docs/architecture/adr-0004-data-config-load-validation.md
    reason: "One behaviour everywhere; GDDs require load error naming the constant; wrong economy must never ship silently"
    referenced_by:
      - docs/architecture/adr-0004-data-config-load-validation.md
    added: 2026-09-30
    revised: ""

  - purpose: web_save_storage
    status: active
    api: "Browser localStorage through the HTML-shell helper + JavaScriptBridge.get_interface; one versioned JSON blob; desktop FileBackend user://save.json with temp + DirAccess.rename_absolute"
    not: "user:// (IDBFS) for save data on web; direct IndexedDB from JS; OS.is_userfs_persistent() as a durability check"
    adr: docs/architecture/adr-0005-local-persistence-savestore.md
    reason: "Godot syncs user:// from the main loop, which stops when the tab is hidden; localStorage.setItem is synchronous and works inside the visibility callback"
    referenced_by:
      - docs/architecture/adr-0005-local-persistence-savestore.md
    added: 2026-09-30
    revised: ""

  - purpose: barista_and_guest_pathfinding
    status: active
    api: "NavigationServer3D.map_get_path(map, from, to, optimize=true) on a private map, behind the Navigator interface (NavServerNavigator)"
    not: "NavigationAgent3D / NavigationRegion3D / NavigationObstacle3D nodes; AStarGrid2D (kept only as GridNavigator contingency behind Navigator); RVO avoidance"
    adr: docs/architecture/adr-0006-navigation-tap-picking.md
    reason: "Agent nodes need per-node _physics_process and auto-repath (ADR-0003, Rule 5) and duplicate the radius; measured path length 0.958x the prototype, clearance 0.380 m at r 0.40"
    referenced_by:
      - docs/architecture/adr-0006-navigation-tap-picking.md
    added: 2026-09-30
    revised: ""

  - purpose: navmesh_bake
    status: active
    api: "Runtime NavigationServer3D.bake_from_source_geometry_data from KitchenConfig footprints: floor triangles + add_projected_obstruction(carve=false); cell_size = cell_height = 0.05, agent_radius = ControlConfig.agent_radius (multiple of 0.05), agent_height 1.0, agent_max_climb 0.0, edge_max_error 0.5"
    not: "carve=true (clearance 0.000); cell_size 0.125/0.25 (radius ceiled to 0.50, 15/19 points off the mesh); editor-baked NavigationRegion3D (stale radius); NavigationMesh y as floor height (surface sits 0.10 m up)"
    adr: docs/architecture/adr-0006-navigation-tap-picking.md
    reason: "Verified on 4.7.2; single source for radius; bake ~5 ms desktop (wasm unmeasured; contingency pre-baked .res from the same baker)"
    referenced_by:
      - docs/architecture/adr-0006-navigation-tap-picking.md
    added: 2026-09-30
    revised: ""

  - purpose: navigation_map_sync
    status: active
    api: "Private map with map_set_use_async_iterations(false); Pathing.poll_ready() calls map_force_update once per Booting frame; ready = map_get_iteration_id(map) > 0 and map_get_closest_point(spawn) within 0.01 m XZ"
    not: "Querying right after setup; relying on the engine loop to sync a hand-made map; the world's default navigation map"
    adr: docs/architecture/adr-0006-navigation-tap-picking.md
    reason: "Queries before first sync print an engine ERROR and return empty; normal runs sync by frame 1 but --script/headless tests never do without force_update, so forcing keeps both identical (observed 4.7.2)"
    referenced_by:
      - docs/architecture/adr-0006-navigation-tap-picking.md
      - docs/architecture/adr-0001-web-build-platform-shell.md
      - docs/architecture/adr-0003-match-simulation-clock-tick-events.md
    added: 2026-09-30
    revised: ""

  - purpose: tap_picking
    status: active
    api: "Camera3D-based TapProjector: to_screen (unproject_position) for anchor proximity <= tap_pick_radius, then AABB.intersects_ray over static footprints/guest hit-boxes, then Plane(UP, 0).intersects_ray; input via _unhandled_input (ScreenTouch pressed + left MouseButton pressed), one stored press, resolved in flush()"
    not: "PhysicsDirectSpaceState3D.intersect_ray / RayCast3D / Area3D / any CollisionObject3D in the kitchen; resolving inside the input callback; pick by work point on the floor"
    adr: docs/architecture/adr-0006-navigation-tap-picking.md
    reason: "Principle 6 (no physics world); Logic-testable with FakeProjector; pick anchors match the playtested prototype"
    referenced_by:
      - docs/architecture/adr-0006-navigation-tap-picking.md
    added: 2026-09-30
    revised: ""

  - purpose: render_resolution_cap
    status: active
    api: "Viewport.scaling_3d_scale (Bilinear) = clamp(sqrt(render_pixel_budget / canvas_px_area), render_scale_min, render_scale_3d), static per canvas size, from ViewConfig"
    not: "Runtime adaptive/dynamic resolution; allow_hidpi=false as the primary cap (kept as WebGL2 fallback)"
    adr: docs/architecture/adr-0007-performance-load-budgets.md
    reason: "Fill-rate dominates on high-DPR phones; scale verified applied in 4.7.2 gl_compatibility (desktop)"
    referenced_by:
      - docs/architecture/adr-0007-performance-load-budgets.md
      - docs/architecture/adr-0002-viewport-camera-fit-presentation.md
    added: 2026-09-30
    revised: ""

  - purpose: boot_shader_prewarm
    status: active
    api: "RenderPrewarm during Booting: visible, in-frustum instances of every material variant + AnimatedSprite3D sets under the gameplay Environment/camera, full charset on a live Label3D, each SFX at zero volume; await RenderingServer.frame_post_draw x2; then mark_boot_complete()"
    not: "visible=false / off-screen / modulate.a=0 instances (not drawn, compile nothing); Shader Baker (no GL/WebGL support)"
    adr: docs/architecture/adr-0007-performance-load-budgets.md
    reason: "Compatibility compiles programs on first draw; avoid first-spawn hitch"
    referenced_by:
      - docs/architecture/adr-0007-performance-load-budgets.md
      - docs/architecture/adr-0001-web-build-platform-shell.md
      - docs/architecture/adr-0003-match-simulation-clock-tick-events.md
    added: 2026-09-30
    revised: ""

  - purpose: perf_measurement
    status: active
    api: "PerfProbe (RefCounted) created only when OS.has_feature(\"perf_probe\"); wraps step() calls in MatchDirector with Time.get_ticks_usec; export presets web-perf (release: timings, wasm heap via JS) and web-perf-debug (debug: orphans, MEMORY_STATIC leak run)"
    not: "MEMORY_STATIC / OBJECT_ORPHAN_NODE_COUNT as evidence from release builds (read 0); timing assertions in CI"
    adr: docs/architecture/adr-0007-performance-load-budgets.md
    reason: "Debug-only counters; coarse web timers; determinism rule for tests"
    referenced_by:
      - docs/architecture/adr-0007-performance-load-budgets.md
    added: 2026-09-30
    revised: ""

  # Appended 2026-09-30 — audio (ADR-0001 amendment)
  - purpose: web_audio_playback_and_unlock
    status: active
    # revised 2026-09-30 — old api: "default_playback_type.web = Sample (default); loop=true in import; MusicPlayer.play() on first gesture; ..."; old not: "Stream playback on single-thread web (crackle); ..."
    api: "SFX: default_playback_type.web = Sample (default). MusicPlayer: playback_type = Stream, output_latency.web = 100; stream = AudioStreamOggVorbis.load_from_buffer(HTTPRequest body) with loop = true set in code (off-web: load(res://)); music starts at 0 once gesture seen + loaded + not paused; pause via stream_paused on MatchLifecycle.paused_changed; MatchEnd = Music-bus AudioEffectLowPassFilter ramp on GameClock.ui_dt (AudioConfig music_lowpass_cutoff_hz 800 / music_lowpass_ramp_s 0.3 defaults); replay = filter off + play(0.0); mute via AudioServer.set_bus_mute(Master)"
    not: "Sample playback for the music track (no bus effects, whole-track synchronous decode); Stream playback for SFX; music in the .pck / on the boot path; Tween-driven filter ramps; music autoplay before a gesture; script-driven looping; per-player volume hacks for mute; SceneTree.paused"
    adr: docs/architecture/adr-0001-web-build-platform-shell.md
    reason: "Browsers suspend AudioContext until a gesture; Web Audio keeps running while the tab is hidden, so pause must be explicit and synchronous; 4.7.2 source: Sample mode ignores AudioEffects and decodes the whole stream at first play"
    referenced_by:
      - docs/architecture/adr-0001-web-build-platform-shell.md
      - docs/architecture/adr-0007-performance-load-budgets.md
    added: 2026-09-30
    revised: 2026-09-30

  # Appended 2026-09-30 — post-boot music fetch (ADR-0001 / ADR-0007 amendments)
  - purpose: post_boot_asset_fetch
    status: active
    api: "Export preset excludes assets/audio/music/*; build step copies the .ogg next to index.html. After ready_reached, _compose() calls AudioDirector.start_music_fetch(PlatformBridge.asset_url(name)); HTTPRequest (use_threads=false) with an absolute URL; one retry after 5 s, then silent"
    not: "Relative URLs in HTTPRequest; fetching before ready_reached (competes with boot download); error UI for a missing track; AudioDirector referencing PlatformBridge by name"
    adr: docs/architecture/adr-0001-web-build-platform-shell.md
    reason: "Keeps the 2.6 MB track off the 13.5 MB boot download and cold-TTI path"
    referenced_by:
      - docs/architecture/adr-0001-web-build-platform-shell.md
      - docs/architecture/adr-0007-performance-load-budgets.md
    added: 2026-09-30
    revised: ""

