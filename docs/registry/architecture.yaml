# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - target_fps: 60
    floor_fps: 30
    total_frame_budget_ms: 16.6
    floor_frame_budget_ms: 33.3
    platform: "Web (WebGL2); floor applies to the reference low-end Android class (RD)"
    script_total_ms: "avg <= 2.0, p99 <= 4.0 (sim + presentation scripts on RD)"
    render: "draw calls <= 100 target / 150 ceiling per frame incl. HUD; <= 75 renderable 3D instances worst case; textures <= 48 MB incl. mipmaps; 3D pixel budget 1.5 Mpx via scaling_3d_scale (floor 0.6)"
    memory: "wasm heap peak <= 256 MB (read from JS); <= 2 MB growth over 5 matches"
    load: "boot download (compressed) <= 13.5 MB (engine 10.2 MB measured, .pck <= 3.0 MB); cold TTI <= 20 s @10 Mbps, warm <= 6 s; post-boot music file <= 2.7 MB fetched after ready_reached, outside the boot total and TTI (amendment 2026-09-30)"
    adr: docs/architecture/adr-0007-performance-load-budgets.md
    added: 2026-09-30
    revised: ""

  - system: match-director
    status: active
    budget_ms: 0.05
    adr: docs/architecture/adr-0007-performance-load-budgets.md
    notes: "Incl. GameClock; RD avg"
    referenced_by: [docs/architecture/adr-0007-performance-load-budgets.md]
    added: 2026-09-30
    revised: ""

  - system: tap-picker
    status: active
    budget_ms: 0.05
    adr: docs/architecture/adr-0007-performance-load-budgets.md
    notes: "Tick step 2; p99 0.30 reported"
    referenced_by: [docs/architecture/adr-0007-performance-load-budgets.md, docs/architecture/adr-0006-navigation-tap-picking.md]
    added: 2026-09-30
    revised: ""

  - system: barista-controller
    status: active
    budget_ms: 0.10
